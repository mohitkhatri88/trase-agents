# Render Blueprint. Committing the config beats clicking through a dashboard:
# it is reviewable, reproducible, and the interesting decisions get to carry
# their reasoning with them.
#
# To deploy: Render dashboard → New → Blueprint → pick this repo.

services:
  - type: web
    name: trase-agents
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    region: oregon

    # NOT a cost setting. The event bus is in-process and the database is a
    # file on one disk, so a second instance would see neither — it would look
    # healthy while dropping every event for half of all users. Raising this
    # requires the store and bus swaps described in the README first.
    numInstances: 1

    # Must not point at a streaming endpoint, or the instance gets killed as
    # unhealthy while it waits for a run to finish.
    healthCheckPath: /health

    autoDeploy: true

    disk:
      name: trase-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: NODE_ENV
        value: production
      # Render injects PORT; the server reads it and falls back to 3000.
      - key: COMMIT_SHA
        fromService:
          type: web
          name: trase-agents
          property: commitId
