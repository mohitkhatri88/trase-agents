# Render Blueprint. Committing the config beats clicking through a dashboard:
# it is reviewable, reproducible, and the interesting decisions get to carry
# their reasoning with them.
#
# To deploy: Render dashboard → Blueprints → New Blueprint Instance → this repo.
# (Not "New → Static Site". This is a Node process serving an API and the built
# UI from one port, which is a Web Service.)
#
# COST. Two layers, easily confused:
#
#   • Workspace plan — Hobby $0 / Pro $25. Buys team seats, bandwidth, audit
#     logs. A solo project needs none of it, so stay on Hobby.
#   • Compute — billed per instance, on top of any workspace plan.
#
# Paying for Pro would NOT remove the free tier's cold start, because that is a
# property of the instance type, not the workspace. The Starter instance below
# is what removes it: ~$7/month on the free Hobby workspace, prorated by the
# second, plus a few cents for the disk.

services:
  - type: web
    name: trase-agents
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon

    # Never sleeps. The free instance type spins down after 15 minutes idle and
    # takes ~1 minute to wake, which for a link someone clicks once means a
    # minute of blank loading page — the worst possible first impression for an
    # app whose whole point is that it responds immediately.
    plan: starter

    # NOT a cost setting. The event bus is in-process and the database is a file
    # on one disk, so a second instance would see neither — it would look
    # perfectly healthy while dropping every event for half of all users.
    # Raising this requires the store and bus swaps described in the README.
    #
    # Conveniently, attaching a disk constrains the service to one instance
    # anyway, so the infrastructure enforces what the design already requires.
    numInstances: 1

    # Must not point at a streaming endpoint, or the instance gets killed as
    # unhealthy while it waits for a run to finish.
    healthCheckPath: /health

    autoDeploy: true

    # Keeps the SQLite file across restarts and deploys, so a reviewer's tasks
    # and run history are still there when they come back.
    disk:
      name: trase-data
      mountPath: /data
      sizeGB: 1

    envVars:
      - key: DATABASE_URL
        value: file:/data/app.db
      - key: NODE_ENV
        value: production
    # PORT and RENDER_GIT_COMMIT are injected automatically — the server reads
    # both, so neither needs declaring here. (`fromService.property` only
    # exposes connection details: connectionString, host, hostport, port.)
