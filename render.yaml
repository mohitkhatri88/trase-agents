# Render Blueprint. Committing the config beats clicking through a dashboard:
# it is reviewable, reproducible, and the interesting decisions get to carry
# their reasoning with them.
#
# To deploy: Render dashboard → Blueprints → New Blueprint Instance → this repo.
# (Not "New → Static Site". This is a Node process serving an API and the built
# UI from one port, which is a Web Service.)
#
# Runs on the free Hobby *workspace* plan — the $25 Pro plan buys team seats and
# audit logs, none of which this needs. Only compute is billed, and the free
# instance type below costs nothing.

services:
  - type: web
    name: trase-agents
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: oregon

    # ── Free tier ──────────────────────────────────────────────────────────
    # Costs nothing, with two consequences worth knowing before you send the
    # link to anyone:
    #
    #   1. Spins down after 15 minutes idle and takes ~1 minute to wake. A
    #      reviewer clicking cold sees a loading page for that minute.
    #   2. Cannot attach a persistent disk, so the database lives on an
    #      ephemeral filesystem and resets on every spin-down and deploy.
    #
    # The reset is survivable — arguably good — because seeding runs on boot,
    # so every wake hands the visitor a clean, populated demo. The cold start
    # is the real cost.
    plan: free

    # ── To remove both, switch to a paid instance ──────────────────────────
    # Replace `plan: free` with `plan: starter`, set DATABASE_URL to
    # file:/data/app.db below, and uncomment:
    #
    # disk:
    #   name: trase-data
    #   mountPath: /data
    #   sizeGB: 1
    #
    # Starter never sleeps and keeps its disk across deploys. Check the current
    # price on Render's pricing page — it is billed as compute on top of the
    # free Hobby workspace, not as a workspace upgrade.

    # NOT a cost setting. The event bus is in-process and the database is a
    # single file, so a second instance would see neither — it would look
    # perfectly healthy while dropping every event for half of all users.
    # Raising this requires the store and bus swaps described in the README.
    numInstances: 1

    # Must not point at a streaming endpoint, or the instance gets killed as
    # unhealthy while it waits for a run to finish.
    healthCheckPath: /health

    autoDeploy: true

    envVars:
      # Ephemeral on the free tier, which is why seeding runs on every boot.
      # Change to file:/data/app.db when attaching a disk.
      - key: DATABASE_URL
        value: file:/tmp/trase/app.db
      - key: NODE_ENV
        value: production
      # Render injects PORT; the server reads it and falls back to 3000.
      - key: COMMIT_SHA
        fromService:
          type: web
          name: trase-agents
          property: commitId
